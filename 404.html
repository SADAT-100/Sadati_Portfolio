<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Sadati Fred Mwasongwe</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("sfm-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Absolute-from-root paths are avoided so this works on GitHub Pages project sites too. -->
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .nf__card { max-width: 560px; padding: clamp(28px, 5vw, 48px); }
    .nf__code { font-family: var(--font-mono); font-size: clamp(4rem, 14vw, 7rem); line-height: 1; letter-spacing: -.04em; }
    .nf h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); margin: 14px 0 10px; }
    .nf p { color: var(--text-2); }
    .nf__actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__grid"></div>
    <div class="ambient__orb ambient__orb--a"></div>
    <div class="ambient__orb ambient__orb--b"></div>
  </div>
  <main class="nf">
    <div class="nf__card glass">
      <p class="kicker mono"><span>ERR</span> Signal lost</p>
      <div class="nf__code grad-text">404</div>
      <h1>This page is off the grid.</h1>
      <p>The link may be outdated or mistyped. Everything lives on the main page.</p>
      <div class="nf__actions">
        <a class="btn btn--primary" href="./">Back to home</a>
        <a class="btn btn--glass" href="./#documents">Documents</a>
        <a class="btn btn--ghost" href="./#contact">Contact</a>
      </div>
    </div>
  </main>
</body>
</html>
